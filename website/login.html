<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Ride - Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <form id="loginForm" class="login-card">

            <h1>Welcome Back</h1>

            <p>
                Login to continue using Easy Ride.
            </p>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <i class="fa-solid fa-eye eye"></i>

            </div>

            <p id="loginMessage"></p>

            <button id="submit" type="submit">
                Login
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Continue with Google
            </button>

            <p class="login-link">
                Don't have an account?
                <a href="sign-up.html">Create Account</a>
            </p>

        </form>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="content">

            <!-- <img src="image/easy-ride logo.png"
                 class="logo"
                 alt="logo"> -->

            <h1>Easy <span style="color: black;">Ride</span></h1>

            <p>

                Fast • Safe • Reliable

                <br><br>

                Welcome back!
                Login and continue your journey with Easy Ride.

            </p>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
